<body><nav class="project-nav"><a class="project-brand" href="index.html">PRODUCT<span>VERIFY</span></a><div class="project-links"><a href="index.html">Home</a><a href="manufacturer.html">Manufacturer</a><a href="seller.html">Seller</a><a href="consumer.html">Consumer</a><a href="confirmPurchase.html">Confirm Purchase</a></div></nav><header class="project-heading"><p class="eyebrow">BLOCKCHAIN PRODUCT RECORDS</p><h1>Request a sale</h1><p class="project-lead">Enter buyer details, then ask the buyer to confirm.</p></header>
<div aria-live="polite" class="status-message" id="statusMessage" role="status"></div>

<section>
<div class="container">
<h2>Request Product Sale</h2>
<section>
<div class="container-fluid">
<center>
<div id="qr-reader" style="width:300px"></div>
<div id="qr-reader-results"></div>
</center>
</div>
</section>
<div>
<table width="100%">
<tr width="100%">
<td align="center" width="15%">
<label for="productSN">Product SN:</label>
</td>
<td width="30%">
<input class="form-control" disabled="" id="productSN" name="productSN" type="text"/>
</td>
<td align="center" width="15">
<label for="consumerCode">Purchase Code</label>
</td>
<td width="30%">
<input class="form-control" id="consumerCode" name="consumerCode" type="text"/>
<label for="buyerWallet">Buyer wallet address</label>
<input autocomplete="off" class="form-control" id="buyerWallet" name="buyerWallet" placeholder="0x..." type="text"/>
</td>
</tr>
</table>
</div>
<p class="field-hint">The buyer must confirm the purchase from the connected wallet before ownership is recorded.</p><p><a href="cancelSale.html">Cancel a pending request</a></p><div class="clear"> </div>
<button class="btn btn-warning btn-register" id="register" type="submit">Request Sale</button>
</div>
</section>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="js/popper.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/main.js"></script>
<script src="js/web3.min.js"></script>
<script src="js/truffle-contract.js"></script>
<script src="js/chainConnection.js"></script>
<script src="js/recordConsumerSale.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<script>
	var decodedText = "Enter Product SN";
    function docReady(fn) {
        // see if DOM is already available
        if (document.readyState === "complete"
            || document.readyState === "interactive") {
            // call on next available tick
            setTimeout(fn, 1);
        } else {
            document.addEventListener("DOMContentLoaded", fn);
        }
    }

    docReady(function () {
        var resultContainer = document.getElementById('qr-reader-results');
        var lastResult, countResults = 0;
        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText !== lastResult) {
                ++countResults;
                lastResult = decodedText;
                // Handle on success condition with the decoded message.
                var audio = new Audio('beep.wav');
                audio.play().catch(function () {});
                // console.log(`Scan result ${decodedText}`, decodedResult);
                document.getElementById('qr-reader-results').textContent = decodedText;
				document.getElementById("productSN").value = decodedText;
				//App.init(decodedText);
                
            }
        }

        var html5QrcodeScanner = new Html5QrcodeScanner(
            "qr-reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    });
  </script>
</body>
</html>
